# Governed object registry for metadata.meta.layer_catalog.
# Collector upserts by object_fqn (idempotent).

objects:
  - object_fqn: bronze.clickstream_events
    object_type: external
    platform_layer: bronze
    domain: digital
    owner: data-platform
    grain: one row per clickstream event
    timestamp_column: event_time
    freshness_sla_minutes: 60
    is_active: true

  - object_fqn: bronze.inventory_events
    object_type: external
    platform_layer: bronze
    domain: supply
    owner: data-platform
    grain: one row per inventory event
    timestamp_column: event_time
    freshness_sla_minutes: 60
    is_active: true

  - object_fqn: bronze.pos_transactions
    object_type: external
    platform_layer: bronze
    domain: finance
    owner: data-platform
    grain: one row per POS line item
    timestamp_column: transaction_date
    freshness_sla_minutes: 1440
    is_active: true

  - object_fqn: silver.inventory_hourly
    object_type: external
    platform_layer: silver
    domain: supply
    owner: data-platform
    grain: (store_id, product_id, hour_ts)
    timestamp_column: hour_ts
    freshness_sla_minutes: 120
    is_active: true

  - object_fqn: finance.fact_sales
