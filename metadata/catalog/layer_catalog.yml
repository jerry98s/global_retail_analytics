# Governed object registry for metadata.meta.layer_catalog.
# Collector upserts by object_fqn (idempotent).
#
# grain is the unique-key tuple, e.g. (date_key, store_key), whenever the
# object has one; prose only for objects without a key (raw Bronze ledgers,
# single-row views). object_type external = read through Spectrum on main.

objects:
  - object_fqn: bronze.clickstream_records
    object_type: iceberg
    platform_layer: bronze
    domain: digital
    owner: data-platform
    grain: one row per captured Kafka delivery (transport repeats retained)
    timestamp_column: ingested_at
    freshness_sla_minutes: 60
    is_active: true

  - object_fqn: bronze.inventory_records
    object_type: iceberg
    platform_layer: bronze
    domain: supply
    owner: data-platform
    grain: one row per captured Kafka delivery (transport repeats retained)
    timestamp_column: ingested_at
    freshness_sla_minutes: 60
    is_active: true

  - object_fqn: silver.clickstream_events
    object_type: external
    platform_layer: silver
    domain: digital
    owner: data-platform
    grain: (event_id)
    timestamp_column: event_time
    freshness_sla_minutes: 60
    is_active: true

  - object_fqn: silver.inventory_events
    object_type: external
    platform_layer: silver
