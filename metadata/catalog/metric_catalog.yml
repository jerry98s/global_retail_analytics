# Operational metric definitions for metadata.meta.metric_catalog.
# Collector upserts by metric_name (idempotent).
#
# Only metrics over the metadata DB (meta.*) live here. Analytics metrics over
# summary.* are defined once in the dbt semantic layer
# (transformation/dbt_project/models/semantic/metrics.yml, ADR-013);
# seed-catalog derives their meta.metric_catalog rows from it.

metrics:
  - metric_name: pipeline_success_rate
    description: Share of finished pipeline runs with status SUCCESS
    source_relation: meta.pipeline_run
    expression: CAST(SUM(CASE WHEN status = 'SUCCESS' THEN 1 ELSE 0 END) AS DOUBLE PRECISION) / NULLIF(COUNT(*), 0)
    grain: (pipeline_name, environment, day)
    unit: ratio
    owner: data-platform
    is_active: true

  - metric_name: table_freshness_breach_count
    description: Count of freshness observations with sla_status = breach
    source_relation: meta.table_freshness
    expression: SUM(CASE WHEN sla_status = 'breach' THEN 1 ELSE 0 END)
    grain: (measured_at day)
    unit: count
    owner: data-platform
    is_active: true

  - metric_name: table_freshness_unknown_count
    description: Count of freshness observations with sla_status = unknown (metadata collection issues)
    source_relation: meta.table_freshness
    expression: SUM(CASE WHEN sla_status = 'unknown' THEN 1 ELSE 0 END)
    grain: (measured_at day)
    unit: count
    owner: data-platform
    is_active: true

  - metric_name: metadata_collection_failure_count
    description: Count of pipeline runs where metadata collection had failures
    source_relation: meta.pipeline_run
    expression: SUM(CASE WHEN error_text LIKE '%metadata%' THEN 1 ELSE 0 END)
    grain: (started_at day)
    unit: count
    owner: data-platform
    is_active: true
