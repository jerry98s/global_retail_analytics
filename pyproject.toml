[project]
name = "global-retail-analytics"
version = "1.0.0"
description = "Local dev + test tooling for the Global Retail Analytics platform."
readme = "README.md"
requires-python = ">=3.10"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "ruff==0.6.9",
    "dbt-core==1.11.*",
    "dbt-duckdb>=1.10,<2.0",
    "duckdb>=1.5,<2.0",
    "duckdb-engine>=0.13,<0.18",
    "great-expectations==0.18.21",
    "pyarrow>=14,<19",
    "structlog>=24.1",
    "boto3>=1.34",
    "confluent-kafka>=2.3",
]

[tool.pytest.ini_options]
minversion = "7.0"
# Bare `pytest` runs the fast, offline unit suite. The live-Redshift suite is
# opt-in: `pytest quality/pytest -m integration` (needs RS_* env vars).
# The dbt/DuckDB idempotency suite is opt-in:
# `pytest tests/integration -m integration_duckdb` (needs project venv / dbt-duckdb).
testpaths = ["tests/unit"]
addopts = "--strict-markers"
markers = [
    "unit: fast, offline unit test with no external services or network",
    "integration: requires a live Redshift connection (quality/pytest)",
    "integration_duckdb: requires dbt-duckdb installed; runs the local DuckDB sim (tests/integration)",
]
