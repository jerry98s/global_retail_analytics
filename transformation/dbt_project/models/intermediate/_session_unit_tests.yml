unit_tests:
  - name: int_session_reconstruction_attributes_only_single_account_instances
    description: >
      si-1 has one account, so all three events, including the product view
      before the login, belong to C1's customer. si-2 has two accounts
      (ambiguous) and si-3 none (anonymous); both keep customer_key NULL.
      Pre-1.3 events form one legacy session per (client_id, session_id)
      and stay anonymous even when they carry a customer_id.
    model: int_session_reconstruction
    given:
      - input: ref('stg_clickstream_events')
        rows:
          - {event_id: e1, event_type: product_view, event_time: "2026-11-07 10:00:00", session_id: s-1, session_instance_id: si-1, client_id: c1, platform: web}
          - {event_id: e2, event_type: login, event_time: "2026-11-07 10:01:00", session_id: s-1, session_instance_id: si-1, client_id: c1, customer_id: C1, platform: web}
          - {event_id: e3, event_type: checkout, event_time: "2026-11-07 10:02:00", session_id: s-1, session_instance_id: si-1, client_id: c1, customer_id: C1, platform: web, properties: '{"order_id": "O1", "cart_value": "42.50"}'}
          - {event_id: e4, event_type: login, event_time: "2026-11-07 11:00:00", session_id: s-2, session_instance_id: si-2, client_id: c2, customer_id: C2, platform: web}
          - {event_id: e5, event_type: login, event_time: "2026-11-07 11:01:00", session_id: s-2, session_instance_id: si-2, client_id: c2, customer_id: C3, platform: web}
          - {event_id: e6, event_type: page_view, event_time: "2026-11-07 12:00:00", session_id: s-3, session_instance_id: si-3, client_id: c3, platform: ios}
          - {event_id: e7, event_type: page_view, event_time: "2026-11-07 09:00:00", session_id: s-old, client_id: c4, customer_id: C1, platform: web}
          - {event_id: e8, event_type: page_view, event_time: "2026-11-07 09:50:00", session_id: s-old, client_id: c4, customer_id: C1, platform: web}
      - input: source('silver', 'device_session_associations')
        rows:
          - {client_id: c1, session_instance_id: si-1, customer_id: C1}
          - {client_id: c2, session_instance_id: si-2, customer_id: C2}
          - {client_id: c2, session_instance_id: si-2, customer_id: C3}
      - input: ref('int_identity_resolution')
        rows:
          - {identifier_type: customer_id, identifier_value: C1, customer_key: 100}
          - {identifier_type: customer_id, identifier_value: C2, customer_key: 200}
          - {identifier_type: customer_id, identifier_value: C3, customer_key: 300}
      - input: source('gold_finance', 'dim_date')
        rows:
          - {date_key: 20261107, full_date: "2026-11-07"}
    expect:
      rows:
        - {session_id: si-1, customer_key: 100, attribution_status: attributed, is_legacy: false, event_count: 3, converted: true, order_id: O1, session_date_key: 20261107}
        - {session_id: si-2, customer_key: null, attribution_status: ambiguous, is_legacy: false, event_count: 2, converted: false, order_id: null, session_date_key: 20261107}
        - {session_id: si-3, customer_key: null, attribution_status: anonymous, is_legacy: false, event_count: 1, converted: false, order_id: null, session_date_key: 20261107}
        - {session_id: "legacy:c4:s-old", customer_key: null, attribution_status: anonymous, is_legacy: true, event_count: 2, converted: false, order_id: null, session_date_key: 20261107}
