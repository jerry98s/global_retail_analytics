unit_tests:
  - name: int_inventory_hourly_keeps_hours_below_the_cutoff
    description: >
      The cutoff is 11:00 exclusive. Hour 10 is summed from canonical events.
      Hour 11 is at the cutoff, so it is not in Gold. A Flink row for hour 10
      is not an input and cannot change the canonical sum.
    model: int_inventory_hourly
    given:
      - input: ref('int_inventory_cutoff')
        rows:
          - {closed_hour_exclusive: 2026110411}
      - input: source('silver', 'inventory_events')
        rows:
          - {event_time: "2026-11-04 10:05:00", product_id: P1, store_id: S1, qty_delta: -5, export_run_id: R1}
          - {event_time: "2026-11-04 10:06:00", product_id: P1, store_id: S1, qty_delta: 10, export_run_id: R1}
          - {event_time: "2026-11-04 11:05:00", product_id: P1, store_id: S1, qty_delta: -1, export_run_id: R1}
    expect:
      rows:
        - {snapshot_date_key: 20261104, snapshot_hour: 10, product_id: P1, store_id: S1, qty_delta_hour: 5, qty_received_hour: 10, is_estimated: false, export_run_id: R1}

  - name: inventory_publication_copies_the_cutoff_without_a_stock_change
    description: >
      The control row advances the cutoff even when this build changes no
      inventory balance. published_at is the build clock and is not asserted.
    model: inventory_publication
    given:
      - input: ref('int_inventory_cutoff')
        rows:
          - {inventory_run_id: R1, bronze_snapshot_id: 9, closed_hour_exclusive: 2026110415, coverage_status: COMPLETE, incomplete_partitions: 0}
    expect:
      rows:
        - {inventory_run_id: R1, bronze_snapshot_id: 9, closed_hour_exclusive: 2026110415, coverage_status: COMPLETE, incomplete_partitions: 0}
