unit_tests:
  - name: fact_inventory_snapshot_late_event_restates_later_balances
    description: >
      P1/S1 opens at 100. The stored fact has hour 10 from Flink (-3), which
      dropped a late +10 receipt. Spark now covers hour 10 and includes the
      receipt (+7). Hour 10 and every later stored hour of P1/S1 (11, 13) move
      by +10. Hour 9 and P2/S1 did not change, so they are not emitted.
    model: fact_inventory_snapshot
    overrides:
      macros:
        is_incremental: true
        column_exists: true
    given:
      - input: this
        rows:
          - {snapshot_date_key: 20261104, snapshot_hour: 9, product_key: 11, product_id: P1, store_key: 1, qty_delta_hour: -5, quantity_on_hand: 95, is_estimated: false}
          - {snapshot_date_key: 20261104, snapshot_hour: 10, product_key: 11, product_id: P1, store_key: 1, qty_delta_hour: -3, quantity_on_hand: 92, is_estimated: true}
          - {snapshot_date_key: 20261104, snapshot_hour: 11, product_key: 11, product_id: P1, store_key: 1, qty_delta_hour: -2, quantity_on_hand: 90, is_estimated: false}
          - {snapshot_date_key: 20261104, snapshot_hour: 13, product_key: 11, product_id: P1, store_key: 1, qty_delta_hour: -1, quantity_on_hand: 89, is_estimated: false}
          - {snapshot_date_key: 20261104, snapshot_hour: 10, product_key: 2, product_id: P2, store_key: 1, qty_delta_hour: -2, quantity_on_hand: 48, is_estimated: false}
      - input: ref('int_inventory_hourly')
        rows:
          - {snapshot_date_key: 20261104, snapshot_hour: 9, product_id: P1, store_id: S1, qty_delta_hour: -5, is_estimated: false}
          - {snapshot_date_key: 20261104, snapshot_hour: 10, product_id: P1, store_id: S1, qty_delta_hour: 7, is_estimated: false}
          - {snapshot_date_key: 20261104, snapshot_hour: 11, product_id: P1, store_id: S1, qty_delta_hour: -2, is_estimated: false}
          - {snapshot_date_key: 20261104, snapshot_hour: 13, product_id: P1, store_id: S1, qty_delta_hour: -1, is_estimated: false}
          - {snapshot_date_key: 20261104, snapshot_hour: 10, product_id: P2, store_id: S1, qty_delta_hour: -2, is_estimated: false}
      - input: ref('dim_product')
        rows:
          - {product_key: 1, product_id: P1, effective_from: "2026-10-01", effective_to: "2026-11-01"}
          - {product_key: 11, product_id: P1, effective_from: "2026-11-01", effective_to: null}
          - {product_key: 2, product_id: P2, effective_from: "2026-10-01", effective_to: null}
      - input: source('gold_finance', 'dim_store')
        rows:
          - {store_key: 1, store_id: S1}
      - input: ref('inventory_opening_balance')
        rows:
          - {product_id: P1, store_id: S1, opening_qty: 100}
          - {product_id: P2, store_id: S1, opening_qty: 50}
    expect:
      rows:
        - {snapshot_date_key: 20261104, snapshot_hour: 10, product_key: 11, product_id: P1, store_key: 1, qty_delta_hour: 7, quantity_on_hand: 102, quantity_available: 102, is_estimated: false}
        - {snapshot_date_key: 20261104, snapshot_hour: 11, product_key: 11, product_id: P1, store_key: 1, qty_delta_hour: -2, quantity_on_hand: 100, quantity_available: 100, is_estimated: false}
        - {snapshot_date_key: 20261104, snapshot_hour: 13, product_key: 11, product_id: P1, store_key: 1, qty_delta_hour: -1, quantity_on_hand: 99, quantity_available: 99, is_estimated: false}

  - name: fact_inventory_snapshot_rewrites_hours_whose_movement_changed
    description: >
      P1/S1 opens at 100. A late correction moves 2 units from hour 10 to
      hour 9: hour 9 now moves -5 instead of -3, hour 10 -2 instead of -4.
      Hour 10's balance is still 93, but its movement changed, so it is
      rewritten with hour 9. Hour 11 is unchanged and not emitted. P2/S1 was
      stored before qty_delta_hour existed (NULL) and is rewritten once.
    model: fact_inventory_snapshot
    overrides:
      macros:
        is_incremental: true
        column_exists: true
    given:
      - input: this
        rows:
          - {snapshot_date_key: 20261104, snapshot_hour: 9, product_key: 11, product_id: P1, store_key: 1, qty_delta_hour: -3, quantity_on_hand: 97, is_estimated: false}
          - {snapshot_date_key: 20261104, snapshot_hour: 10, product_key: 11, product_id: P1, store_key: 1, qty_delta_hour: -4, quantity_on_hand: 93, is_estimated: false}
          - {snapshot_date_key: 20261104, snapshot_hour: 11, product_key: 11, product_id: P1, store_key: 1, qty_delta_hour: -1, quantity_on_hand: 92, is_estimated: false}
          - {snapshot_date_key: 20261104, snapshot_hour: 10, product_key: 2, product_id: P2, store_key: 1, qty_delta_hour: null, quantity_on_hand: 48, is_estimated: false}
      - input: ref('int_inventory_hourly')
        rows:
          - {snapshot_date_key: 20261104, snapshot_hour: 9, product_id: P1, store_id: S1, qty_delta_hour: -5, is_estimated: false}
          - {snapshot_date_key: 20261104, snapshot_hour: 10, product_id: P1, store_id: S1, qty_delta_hour: -2, is_estimated: false}
          - {snapshot_date_key: 20261104, snapshot_hour: 11, product_id: P1, store_id: S1, qty_delta_hour: -1, is_estimated: false}
          - {snapshot_date_key: 20261104, snapshot_hour: 10, product_id: P2, store_id: S1, qty_delta_hour: -2, is_estimated: false}
      - input: ref('dim_product')
        rows:
          - {product_key: 11, product_id: P1, effective_from: "2026-11-01", effective_to: null}
          - {product_key: 2, product_id: P2, effective_from: "2026-10-01", effective_to: null}
      - input: source('gold_finance', 'dim_store')
        rows:
          - {store_key: 1, store_id: S1}
      - input: ref('inventory_opening_balance')
        rows:
          - {product_id: P1, store_id: S1, opening_qty: 100}
          - {product_id: P2, store_id: S1, opening_qty: 50}
    expect:
      rows:
        - {snapshot_date_key: 20261104, snapshot_hour: 9, product_id: P1, qty_delta_hour: -5, quantity_on_hand: 95}
        - {snapshot_date_key: 20261104, snapshot_hour: 10, product_id: P1, qty_delta_hour: -2, quantity_on_hand: 93}
        - {snapshot_date_key: 20261104, snapshot_hour: 10, product_id: P2, qty_delta_hour: -2, quantity_on_hand: 48}

  - name: fact_inventory_snapshot_takes_product_version_valid_on_snapshot_date
    description: >
      P1 has version 1 until 2026-11-04 and version 11 from then (ADR-016).
      The stored rows all carry 1, from before the catalog back-dated the
      change. The 2026-11-03 hour keeps 1 and is not emitted; the 2026-11-04
      hour is re-emitted under 11 with the same balance, which delete+insert
      on product_id replaces. The balance carries across the version change.
    model: fact_inventory_snapshot
    overrides:
      macros:
        is_incremental: true
        column_exists: true
    given:
      - input: this
        rows:
          - {snapshot_date_key: 20261103, snapshot_hour: 9, product_key: 1, product_id: P1, store_key: 1, qty_delta_hour: -5, quantity_on_hand: 95, is_estimated: false}
          - {snapshot_date_key: 20261104, snapshot_hour: 9, product_key: 1, product_id: P1, store_key: 1, qty_delta_hour: -2, quantity_on_hand: 93, is_estimated: false}
      - input: ref('int_inventory_hourly')
        rows:
          - {snapshot_date_key: 20261103, snapshot_hour: 9, product_id: P1, store_id: S1, qty_delta_hour: -5, is_estimated: false}
          - {snapshot_date_key: 20261104, snapshot_hour: 9, product_id: P1, store_id: S1, qty_delta_hour: -2, is_estimated: false}
      - input: ref('dim_product')
        rows:
          - {product_key: 1, product_id: P1, effective_from: "2026-10-01", effective_to: "2026-11-04"}
          - {product_key: 11, product_id: P1, effective_from: "2026-11-04", effective_to: null}
      - input: source('gold_finance', 'dim_store')
        rows:
          - {store_key: 1, store_id: S1}
      - input: ref('inventory_opening_balance')
        rows:
          - {product_id: P1, store_id: S1, opening_qty: 100}
    expect:
      rows:
        - {snapshot_date_key: 20261104, snapshot_hour: 9, product_key: 11, product_id: P1, store_key: 1, quantity_on_hand: 93, quantity_available: 93, is_estimated: false}
