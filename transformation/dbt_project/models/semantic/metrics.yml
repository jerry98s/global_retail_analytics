version: 2

metrics:
  - name: net_revenue
    label: Net revenue
    description: Net revenue, voided lines excluded.
    type: simple
    type_params:
      measure: net_revenue

  - name: gross_revenue
    label: Gross revenue
    type: simple
    type_params:
      measure: gross_revenue

  - name: gross_margin
    label: Gross margin
    type: simple
    type_params:
      measure: gross_margin

  - name: units_sold
    label: Units sold
    type: simple
    type_params:
      measure: units_sold

  - name: transaction_count
    label: Transactions
    type: simple
    type_params:
      measure: transaction_count

  - name: ending_on_hand_qty
    label: Quantity on hand
    description: On-hand units at the end of the period (last day), summed across products and stores.
    type: simple
    type_params:
      measure: ending_on_hand_qty

  - name: ending_available_qty
    label: Quantity available
    description: Available units (on-hand floored at zero) at the end of the period.
    type: simple
    type_params:
      measure: ending_available_qty

  - name: stockout_hour_count
    label: Stockout hours
    description: Product/store hours with on-hand <= 0 in the period.
    type: simple
    type_params:
      measure: stockout_hour_count

  - name: session_count
    label: Sessions
    type: simple
    type_params:
      measure: session_count

  - name: converted_sessions
    label: Converted sessions
    type: simple
    type_params:
      measure: converted_sessions

  - name: product_view_count
    label: Product views
    type: simple
    type_params:
      measure: product_view_count

  - name: add_to_cart_count
    label: Add to carts
    type: simple
    type_params:
      measure: add_to_cart_count

  - name: conversion_rate
    label: Session conversion rate
    description: Converted sessions divided by sessions, recomputed from the totals rather than averaging the daily conversion_rate column.
    type: ratio
    type_params:
      numerator: converted_sessions
      denominator: session_count
