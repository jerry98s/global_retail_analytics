version: 2

# dbt Semantic Layer (MetricFlow, legacy spec for dbt Core 1.11). ADR-013.
#
# Semantic models sit on the summary.* tables and the dim_store seed only, never
# on the facts. The dashboard runs SQL that MetricFlow compiles from these
# definitions (dashboard/semantic_queries.py, regenerated by
# scripts/common/generate_semantic_queries.py; CI runs --check).
#
# Time dimensions parse the YYYYMMDD integer keys with plain substring/cast,
# which runs unchanged on DuckDB and Redshift (expr is not Jinja-rendered).
#
# Naming: measures and metrics use the summary column name they aggregate.
# Time dimensions drop _key from the date key (snapshot_date_key ->
# snapshot_date, session_date_key -> session_date); the generic date_key on
# sales becomes sales_date. Primary entities name the grain (store_day = one
# store on one day).

models:
  - name: metricflow_time_spine
    description: MetricFlow day time spine over finance.dim_date.
    time_spine:
      standard_granularity_column: date_day
    columns:
      - name: date_day
        granularity: day
        tests: [not_null, unique]

semantic_models:
  - name: store
    description: Store attributes from the finance.dim_store seed.
    model: ref('dim_store')
    entities:
      - name: store
        type: primary
        expr: store_key
    dimensions:
      - name: store_id
        type: categorical
      - name: store_name
        type: categorical
      - name: store_type
        type: categorical
      - name: city
        type: categorical
      - name: country_code
        type: categorical
      - name: region
        type: categorical

  - name: sales_daily_store
    description: Daily store sales, voided lines excluded. Grain (date_key, store_key).
    model: ref('sales_daily_store')
    defaults:
      agg_time_dimension: sales_date
    primary_entity: store_day
    entities:
      - name: store
        type: foreign
        expr: store_key
    dimensions:
      - name: sales_date
        type: time
        expr: >-
          cast(substring(cast(date_key as varchar), 1, 4) || '-' || substring(cast(date_key as varchar), 5, 2)
          || '-' || substring(cast(date_key as varchar), 7, 2) as date)
        type_params:
          time_granularity: day
    measures:
      - name: net_revenue
        agg: sum
      - name: gross_revenue
        agg: sum
      - name: gross_margin
        agg: sum
      - name: units_sold
        agg: sum
      - name: transaction_count
        description: Distinct POS transactions. Additive because a transaction has one store and one day.
        agg: sum

  - name: inventory_position_daily
    description: >
      Dense daily inventory position, every product/store every day.
      Grain (snapshot_date_key, product_id, store_id).
    model: ref('inventory_position_daily')
    defaults:
      agg_time_dimension: snapshot_date
    primary_entity: product_store_day
    entities:
      - name: store
        type: foreign
        expr: store_key
      - name: product
        type: foreign
        expr: product_id
    dimensions:
      - name: snapshot_date
        type: time
        expr: >-
          cast(substring(cast(snapshot_date_key as varchar), 1, 4) || '-' || substring(cast(snapshot_date_key as varchar), 5, 2)
          || '-' || substring(cast(snapshot_date_key as varchar), 7, 2) as date)
        type_params:
          time_granularity: day
      - name: had_movement
        type: categorical
    measures:
      - name: ending_on_hand_qty
        description: Semi-additive. Sums across products and stores; over time takes the last day in the period.
        agg: sum
        non_additive_dimension:
          name: snapshot_date
          window_choice: max
      - name: ending_available_qty
        description: Semi-additive, like ending_on_hand_qty. On-hand floored at zero.
        agg: sum
        non_additive_dimension:
          name: snapshot_date
          window_choice: max
      - name: stockout_hour_count
        description: Product/store hours with on-hand <= 0. Additive.
        agg: sum

  - name: sessions_daily_platform
    description: Daily platform sessions. Grain (session_date_key, platform).
    model: ref('sessions_daily_platform')
    defaults:
      agg_time_dimension: session_date
    primary_entity: platform_day
    dimensions:
      - name: session_date
        type: time
        expr: >-
          cast(substring(cast(session_date_key as varchar), 1, 4) || '-' || substring(cast(session_date_key as varchar), 5, 2)
          || '-' || substring(cast(session_date_key as varchar), 7, 2) as date)
        type_params:
          time_granularity: day
      - name: platform
        type: categorical
    measures:
      - name: session_count
        agg: sum
      - name: converted_sessions
        agg: sum
      - name: product_view_count
        agg: sum
      - name: add_to_cart_count
        agg: sum
