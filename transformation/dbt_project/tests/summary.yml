version: 2

models:
  - name: sales_daily_store
    description: >
      Daily store sales summary from fact_sales only.
      Grain: (date_key, store_key). Voided lines excluded from measures.
    columns:
      - name: date_key
        description: Calendar date key (YYYYMMDD).
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('gold_finance', 'dim_date')
                field: date_key
      - name: store_key
        description: Store surrogate key.
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('gold_finance', 'dim_store')
                field: store_key
      - name: transaction_count
        tests:
          - not_null
          - non_negative
      - name: units_sold
        tests:
          - not_null
          - non_negative
      - name: gross_revenue
        tests: [not_null]
      - name: net_revenue
        tests: [not_null]
      - name: gross_margin
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - date_key
              - store_key

  - name: inventory_daily_product_store
    description: >
      Daily product/store inventory summary from fact_inventory_snapshot only.
      Grain: (snapshot_date_key, product_key, store_key).
    columns:
      - name: snapshot_date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('gold_finance', 'dim_date')
                field: date_key
      - name: product_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('gold_marketing', 'dim_product')
                field: product_key
      - name: store_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('gold_finance', 'dim_store')
                field: store_key
      - name: ending_on_hand_qty
        tests: [not_null]
      - name: ending_available_qty
        tests:
          - not_null
          - non_negative
      - name: minimum_available_qty
        tests:
          - not_null
          - non_negative
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - snapshot_date_key
              - product_key
              - store_key

  - name: inventory_position_daily
    description: >
      Dense daily inventory position from fact_inventory_snapshot only. One row
      per product/store per day, carried forward from the opening balance, so
      on-hand can be summed across products and stores for a day.
      Grain: (snapshot_date_key, product_id, store_id).
    columns:
      - name: snapshot_date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('gold_finance', 'dim_date')
                field: date_key
      - name: product_id
        tests: [not_null]
      - name: store_id
        tests: [not_null]
      - name: store_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('gold_finance', 'dim_store')
                field: store_key
      - name: ending_on_hand_qty
        tests: [not_null]
      - name: ending_available_qty
        tests:
          - not_null
          - non_negative
      - name: stockout_hour_count
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 24
      - name: had_movement
        description: TRUE when the fact has at least one hour for this product/store on this day.
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - snapshot_date_key
              - product_id
              - store_id

  - name: sessions_daily_platform
    description: >
      Daily platform session summary from fact_customer_session only.
      Grain: (session_date_key, platform).
    columns:
      - name: session_date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('gold_finance', 'dim_date')
                field: date_key
      - name: platform
        tests: [not_null]
      - name: session_count
        description: All sessions, anonymous included; the conversion_rate denominator.
        tests:
          - not_null
          - non_negative
      - name: anonymous_session_count
        description: Sessions with no signed-in account.
        tests:
          - not_null
          - non_negative
      - name: identified_customer_count
        tests:
          - not_null
          - non_negative
      - name: converted_sessions
        tests:
          - not_null
          - non_negative
      - name: conversion_rate
        description: converted_sessions / session_count (NULL when no sessions).
        tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1
                inclusive: true
      - name: product_view_count
        tests:
          - not_null
          - non_negative
      - name: add_to_cart_count
        tests:
          - not_null
          - non_negative
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - session_date_key
              - platform

  - name: consent_identity_daily
    description: >
      Sessions by attribution from fact_customer_session only.
      Grain: (session_date_key, platform, attribution_status).
      Anonymous and ambiguous sessions stay in session_count.
    columns:
      - name: session_date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: source('gold_finance', 'dim_date')
                field: date_key
      - name: platform
        tests: [not_null]
      - name: attribution_status
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['attributed', 'anonymous', 'ambiguous']
      - name: session_count
        tests: [not_null, non_negative]
      - name: converted_sessions
        tests: [not_null, non_negative]
      - name: page_view_sessions
        tests: [not_null, non_negative]
      - name: product_view_sessions
        tests: [not_null, non_negative]
      - name: cart_sessions
        tests: [not_null, non_negative]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - session_date_key
              - platform
              - attribution_status
      - dbt_utils.expression_is_true:
          arguments:
            expression: "converted_sessions <= session_count and cart_sessions <= session_count and product_view_sessions <= session_count and page_view_sessions <= session_count"

  - name: customer_segments
    description: >
      Verified profiles by RFM segment from dim_customer only.
      Grain: rfm_segment. Anonymous sessions are not customers.
    columns:
      - name: rfm_segment
        tests: [not_null, unique]
      - name: customer_count
        tests: [not_null, non_negative]
      - name: marketing_eligible_count
        tests: [not_null, non_negative]
      - name: excluded_count
        tests: [not_null, non_negative]
      - name: lifetime_value
        tests: [not_null]
    tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "marketing_eligible_count + excluded_count = customer_count"
