version: 2

models:
  - name: customer_360_serving
    description: >
      Consent-gated Customer 360 at customer grain: one row per consented
      customer, with sessions from marketing.customer_360_view rolled up.
      BI/dashboard contract for serving.customer_360_serving. dim_product_current
      remains hand-written Redshift DDL (not dbt-managed).
    columns:
      - name: customer_key
        description: "Surrogate customer key (consented customers only). One row per customer."
        tests: [not_null, unique]
      - name: session_count
        description: "Sessions attributed to the customer; 0 when none."
        tests: [not_null]
      - name: converted_session_count
        description: "Sessions that ended in a conversion."
        tests: [not_null]
      - name: last_session_date_key
        description: "Date key of the most recent session; NULL when the customer has no sessions."

  - name: inventory_current_position
    description: >
      Current stock per (product_id, store_id): the latest published balance in
      live finance.fact_inventory_snapshot plus Flink silver.inventory_hourly
      hours after the fact's newest hour (ADR-012 speed layer). Built after the
      warehouse publish; recomputed on every query.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [product_id, store_id]
    columns:
      - name: product_id
        tests: [not_null]
      - name: store_id
        tests: [not_null]
      - name: current_on_hand_qty
        description: "published_on_hand_qty + provisional_qty_delta. Can be negative."
        tests: [not_null]
      - name: current_available_qty
        description: "current_on_hand_qty floored at zero."
        tests: [not_null]
      - name: provisional_qty_delta
        description: "Sum of Flink hourly deltas after the fact's newest hour; 0 when none."
        tests: [not_null]
      - name: as_of_hour_key
        description: "YYYYMMDDHH of the newest hour in the balance; NULL for a pair with only an opening balance."
      - name: is_provisional
        description: "True when the balance includes a Flink hour Spark has not yet confirmed."
        tests: [not_null]
