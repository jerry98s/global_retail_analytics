name: ci

on:
  pull_request:
  push:
    branches: [main, local-testing-version]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: terraform fmt + validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [bootstrap, .]
    defaults:
      run:
        working-directory: infra/terraform/${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.6.6"
          terraform_wrapper: false

      - name: terraform fmt -check
        run: terraform fmt -check -recursive

      # The MWAA module reads the built plugins.zip (not committed).
      - name: build MWAA plugins.zip
        if: matrix.stack == '.'
        working-directory: .
        run: python3 scripts/cloud/build_mwaa_plugins.py

      # validate without contacting the backend or provider APIs
      - name: terraform init -backend=false
        run: terraform init -backend=false -input=false

      - name: terraform validate
        run: terraform validate

  python:
    name: python lint + syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install ruff
        run: pip install ruff==0.6.9

      - name: ruff check
        run: ruff check ingestion streaming scripts quality orchestration spark tests

      - name: compile-all (syntax errors fail fast)
        run: |
          python -m compileall -q ingestion streaming scripts quality orchestration spark

  spark-identity:
    name: Spark GraphFrames identity parity
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"

      - name: install Spark
        run: pip install "pyspark==3.4.1" "numpy<2"

      - name: execute DataFrame + GraphFrames parity smoke test
        run: >
          spark-submit --master local[2]
          --packages graphframes:graphframes:0.8.3-spark3.4-s_2.12
          tests/integration/verify_spark_identity.py

      - name: replay raw Bronze and reconcile canonical Silver
        run: >
          spark-submit --master local[2]
          --packages org.apache.iceberg:iceberg-spark-runtime-3.4_2.12:1.4.3
          tests/integration/verify_bronze_replay.py --iceberg

  unit-tests:
    name: pytest unit (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: pytest unit suite
        # pyyaml: test_metadata_observer imports yaml to parse metadata/catalog.
        # duckdb: the metadata-writer tests exercise real DuckDB writes (embedded,
        # no creds). Everything else third-party is stubbed by tests/unit/conftest.py.
        # pyarrow: local-testing-version bridge tests import generate_pos_parquet
        # (module-level pyarrow import) during collection, even when deselected.
        # jinja2: test_replayable_bronze renders the cloud Flink step template.
        run: pip install pytest==8.4.1 pyyaml==6.0.2 "duckdb>=1.5,<2.0" "pyarrow>=15,<23" "jinja2>=3.1,<4" && pytest tests/unit/ -v --tb=short -m unit

  dbt-duckdb:
    name: dbt identity chain on DuckDB (no cloud creds)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: transformation/dbt_project
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install dbt-duckdb + duckdb + MetricFlow
        run: >
          pip install "dbt-core==1.11.*" "dbt-duckdb>=1.10,<2.0" "duckdb>=1.5,<2.0"
          "dbt-metricflow[dbt-duckdb]==0.15.0" "metricflow==0.213.0"

      - name: create local dbt profile
        run: cp profiles.yml.example profiles.yml

      - name: dbt deps
        run: dbt deps --profiles-dir . --target local

      - name: dbt compile full project
        run: dbt compile --no-partial-parse --profiles-dir . --target local

      # Must run before the pending compiles below: they overwrite
      # target/semantic_manifest.json with *_pending relations.
      - name: dashboard SQL matches the semantic layer (ADR-013)
        working-directory: ${{ github.workspace }}
        run: python scripts/common/generate_semantic_queries.py --check

      - name: dbt compile pending finance and catalog
        run: >
          dbt compile --no-partial-parse --profiles-dir . --target local
          --vars '{"wap_phase": "pending"}'
          --select path:models/marts/finance path:models/marts/summary dim_product

      - name: dbt compile pending marketing
        run: >
          dbt compile --no-partial-parse --profiles-dir . --target local
          --vars '{"wap_phase": "pending"}'
          --select stg_clickstream_events stg_pos_transactions intermediate
          marts.marketing sessions_daily_platform consent_identity_daily customer_segments
          --exclude int_product_catalog dim_product customer_360_view

      - name: identity fixture matches Spark graph logic (ADR-010)
        working-directory: ${{ github.workspace }}
        run: python spark/identity_resolution/generate_fixture.py --check

      - name: reference seeds match simulator entities
        working-directory: ${{ github.workspace }}
        run: python -m ingestion.batch.generate_product_master --check

      - name: dbt seed
        run: dbt seed --profiles-dir . --target local

      - name: empty inventory sources for unit-test column lookup
        # DuckDB unit tests read the live relation to learn column types.
        # These Silver tables have no seed; an empty stand-in is enough.
        run: |
          python - <<'PY'
          import duckdb
          con = duckdb.connect("local_retail.duckdb")
          con.execute("create schema if not exists silver")
          con.execute(
              """
              create table if not exists silver.inventory_events (
                event_id varchar, event_time timestamp, store_id varchar, product_id varchar,
                qty_delta integer, event_type varchar, scanner_id varchar, is_late boolean,
                schema_version varchar, event_date date, source_system varchar, kafka_topic varchar,
                kafka_partition integer, kafka_offset bigint, kafka_timestamp timestamp,
                ingested_at timestamp, export_run_id varchar
              )
              """
          )
          con.execute(
              """
              create table if not exists silver.inventory_hourly (
                snapshot_date_key integer, snapshot_hour integer, product_id varchar, store_id varchar,
                qty_delta_hour bigint, qty_received_hour bigint, is_estimated boolean, export_run_id varchar
              )
              """
          )
          con.execute(
              """
              create table if not exists silver.inventory_offset_gaps (
                source_system varchar, kafka_topic varchar, kafka_partition integer,
                last_offset_before bigint, first_offset_after bigint, missing_offsets bigint,
                gap_start_ts timestamp, gap_end_ts timestamp, export_run_id varchar
              )
              """
          )
          PY

      - name: dbt run identity graph chain
        # int_identity_shared_devices is not upstream of identity_graph (devices
        # never merge customers); build it explicitly so verify_local_identity.py
        # can audit it. The finance and inventory models are here so every unit
        # test can read its relation's columns.
        run: >
          dbt run --profiles-dir . --target local --full-refresh
          --select +identity_graph int_identity_shared_devices int_session_reconstruction
          +fact_sales +fact_inventory_snapshot int_inventory_batch_coverage int_inventory_hourly

      - name: dbt test identity graph chain and every unit test
        # cautious: skip data tests that also depend on models this job doesn't
        # build (fact_sales_customer_key_matches_identity needs fact_sales).
        # test_type:unit is every model's unit test; each one mocks its inputs.
        run: >
          dbt test --profiles-dir . --target local --indirect-selection cautious
          --select int_identity_shared_devices int_identity_resolution identity_graph
          test_type:unit

      - name: verify identity scenarios (verified link, two accounts, shared tablet, unverified claim, legacy)
        working-directory: ${{ github.workspace }}
        run: python tests/integration/verify_local_identity.py

      - name: dbt incremental idempotency (P2.1)
        working-directory: ${{ github.workspace }}
        run: |
          pip install pytest==8.4.1
          pytest tests/integration/test_dbt_idempotency.py -v -m integration_duckdb

  airflow-dagbag:
    name: DAGs load in Airflow 2.8.1 (MWAA constraints)
    runs-on: ubuntu-latest
    env:
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow_ci
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__PLUGINS_FOLDER: ${{ github.workspace }}/.airflow_ci/plugins
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: install MWAA requirements under the Airflow constraints
        run: >
          pip install "apache-airflow==2.8.1"
          -r infra/terraform/modules/mwaa/requirements.txt

      - name: extract plugins.zip as MWAA does
        run: |
          python scripts/cloud/build_mwaa_plugins.py --output "$RUNNER_TEMP/plugins.zip"
          mkdir -p "$AIRFLOW__CORE__PLUGINS_FOLDER"
          python -m zipfile -e "$RUNNER_TEMP/plugins.zip" "$AIRFLOW__CORE__PLUGINS_FOLDER"

      - name: load DagBag
        run: |
          airflow db migrate
          python tests/integration/verify_dagbag.py orchestration/airflow/dags

  shell:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./scripts
          severity: warning
        env:
          SHELLCHECK_OPTS: -e SC2086 -e SC2046

      - name: shellcheck Flink submit script
        run: shellcheck --severity=warning streaming/bin/submit_flink_job.sh

  yaml:
    name: yaml + compose sanity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: docker compose config validates
        run: docker compose -f infra/docker/compose/docker-compose.yml config --quiet

      - name: airflow DAGs compile
        run: python -m compileall -q orchestration/airflow/dags
