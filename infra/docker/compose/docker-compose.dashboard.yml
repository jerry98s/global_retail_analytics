# Optional local dashboard, layered on top of the main stack.
#
#   docker compose -f infra/docker/compose/docker-compose.yml \
#                  -f infra/docker/compose/docker-compose.dashboard.yml up -d dashboard
#
# Mounts the same host Iceberg warehouse the Flink jobs write
# (repo .local/iceberg → /tmp/iceberg). Open http://localhost:8501
services:
  dashboard:
    build:
      context: ../../dashboard
    environment:
      DASHBOARD_MODE: local
      LOCAL_ICEBERG_DIR: /tmp/iceberg
    ports:
      - "8501:8501"
    volumes:
      - ../../../.local/iceberg:/tmp/iceberg:ro
